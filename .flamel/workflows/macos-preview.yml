name: macOS preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: [macos, arm64, macos-native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:ui
      - run: python3 scripts/dependency-notices.py desktop/resources/notices
      - run: node scripts/build-sidecars.mjs debug
      - run: cargo check -p flamel-desktop --locked
